services:
  api:
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-app}
      DB_SSLMODE: disable
      # Migrations are embedded in the binary and applied at startup under an
      # advisory lock. Set to false to run them as a separate deploy step.
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}

      # Infisical runs through the Go SDK inside the app, so no extra container
      # or CLI is needed — only the machine identity credentials. Leave
      # INFISICAL_ENABLED unset (false) to run purely off the vars above.
      INFISICAL_ENABLED: ${INFISICAL_ENABLED:-false}
      INFISICAL_SITE_URL: ${INFISICAL_SITE_URL:-https://app.infisical.com}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
